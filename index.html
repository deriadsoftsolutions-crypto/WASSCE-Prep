<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6e5f" />
    <meta name="description" content="Interactive WASSCE Robotics mock practice for Koase STEM SHS learners." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>WASSCE Robotics Practice</title>
    <script>
      try {
        var t = localStorage.getItem('wassce.theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip" href="#app">Skip to content</a>
    <header class="topbar">
      <div class="topbar-inner">
        <a href="/" class="brand" aria-label="Home">
          <svg viewBox="0 0 64 64" width="36" height="36" aria-hidden="true"><use href="#logo" /></svg>
          <span>Robotics <b>Practice</b></span>
        </a>
        <nav class="mainnav" aria-label="Main">
          <a href="/" data-nav="home">Home</a>
          <a href="/mock" data-nav="mock">Paper 1</a>
          <a href="/paper2" data-nav="paper2">Paper 2</a>
          <a href="/assignments" data-nav="assignments" hidden>Classwork</a>
          <a href="/progress" data-nav="progress">Progress</a>
        </nav>
        <div class="topbar-tools">
          <span id="net-status" class="net-pill" hidden>Offline</span>
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch light or dark mode">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
          </button>
          <button id="learner-chip" class="learner-chip" type="button" hidden></button>
        </div>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <div id="toast" role="status" aria-live="polite"></div>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="logo" viewBox="0 0 64 64">
        <rect x="6" y="6" width="52" height="52" rx="14" fill="#0b6e5f"/>
        <rect x="16" y="20" width="32" height="24" rx="6" fill="#fff"/>
        <circle cx="26" cy="32" r="4" fill="#0b6e5f"/><circle cx="38" cy="32" r="4" fill="#0b6e5f"/>
        <rect x="30" y="11" width="4" height="9" fill="#f2b705"/><circle cx="32" cy="11" r="3.5" fill="#f2b705"/>
        <rect x="22" y="47" width="20" height="4" rx="2" fill="#f2b705"/>
      </symbol>
    </svg>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
